name: Build Ninety Android

# PR: полный compile/lint/test с настоящим libbox.
# Release: только на push semver-тега vX.Y.Z. Для ad-hoc проверки — workflow_dispatch.
on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Ядро: hiddify-sing-box. Тег перемещаем → пин на конкретный SHA (supply-chain).
  HSB_TAG: v1.13.0.h5
  HSB_SHA: 9b6b004adfb079db2134b682f9b4ff42434c2f38
  NDK_VERSION: 28.0.13004108
  # Node20 deprecated на раннерах (форс Node24 с июня 2026). checkout@v5 уже на node24;
  # остальные actions пока могут декларировать node20 — проверяем Node24 заранее.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Android SDK packages + NDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build libbox.aar (gomobile bind, hiddify-sing-box)
        run: |
          set -e
          echo "Cloning hiddify-sing-box ${HSB_TAG}…"
          git clone --depth 1 --branch "${HSB_TAG}" https://github.com/hiddify/hiddify-sing-box.git hsb
          cd hsb
          HEAD="$(git rev-parse HEAD)"
          if [ "$HEAD" != "${HSB_SHA}" ]; then
            echo "::error::hiddify-sing-box ${HSB_TAG} = $HEAD, ожидался ${HSB_SHA} (тег перемещён?)"
            exit 1
          fi
          echo "Verified hiddify-sing-box commit $HEAD."

          # gomobile/gobind — форк sagernet (sing-box собирается только им).
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.11
          export PATH="$PATH:$(go env GOPATH)/bin"

          java --version
          go run ./cmd/internal/build_libbox -target android

          ls -lh libbox*.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          echo "libbox.aar -> app/libs/ ($(du -h libbox.aar | cut -f1))"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Каждая проверка пишет отдельный лог и не обрывает job: так последующий
      # artifact содержит точную ошибку даже при падении компиляции или lint.
      - name: Core model tests
        id: core_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :core:model:test --no-daemon --stacktrace 2>&1 | tee ci-core-tests.log

      - name: Assemble debug APK
        id: assemble_debug
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-assemble-debug.log

      - name: Android lint
        id: lint_debug
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --no-daemon --stacktrace 2>&1 | tee ci-lint-debug.log

      - name: Upload PR verification diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-ci-diagnostics-${{ github.event.pull_request.number }}
          if-no-files-found: warn
          path: |
            ci-*.log
            core/model/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug/**

      - name: Fail when verification failed
        if: always()
        env:
          CORE_TESTS: ${{ steps.core_tests.outcome }}
          ASSEMBLE_DEBUG: ${{ steps.assemble_debug.outcome }}
          LINT_DEBUG: ${{ steps.lint_debug.outcome }}
        run: |
          echo "core tests:     $CORE_TESTS"
          echo "assemble debug: $ASSEMBLE_DEBUG"
          echo "lint debug:     $LINT_DEBUG"
          if [ "$CORE_TESTS" != "success" ] || [ "$ASSEMBLE_DEBUG" != "success" ] || [ "$LINT_DEBUG" != "success" ]; then
            exit 1
          fi

      - name: Upload PR debug APKs
        if: github.event_name == 'pull_request' && steps.assemble_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-debug-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ninety-release.jks"

      - name: Assemble release APKs (per-ABI)
        if: github.event_name != 'pull_request'
        env:
          NINETY_KEYSTORE: ${{ runner.temp }}/ninety-release.jks
          NINETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NINETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Stage release APKs
        if: github.event_name != 'pull_request'
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in main|"") VER="${GITHUB_SHA::7}";; esac
          DIR=app/build/outputs/apk/release
          mkdir -p staged
          for ABI in arm64-v8a armeabi-v7a; do
            cp "$DIR/app-${ABI}-release.apk" "staged/ninety-android-${VER}-${ABI}.apk"
            echo "staged ninety-android-${VER}-${ABI}.apk ($(du -h "$DIR/app-${ABI}-release.apk" | cut -f1))"
          done

      - name: Upload release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-apk
          path: staged/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ninety Android ${{ github.ref_name }}
          files: staged/*.apk
          prerelease: false
          make_latest: true
