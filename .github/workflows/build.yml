name: Build Ninety Android

# Релиз — только на push semver-тега vX.Y.Z. Для ad-hoc проверки — workflow_dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  # Ядро: hiddify-sing-box. Тег перемещаем → пин на конкретный SHA (supply-chain).
  HSB_TAG: v1.13.0.h5
  HSB_SHA: 9b6b004adfb079db2134b682f9b4ff42434c2f38
  # Второе ядро: XTLS/libXray (xray-core для xhttp-нод, two-core bridge). Пин по SHA.
  LIBXRAY_TAG: v26.1.23
  LIBXRAY_SHA: 118a5a67a9116eb52751e55a33bb27a02da34571
  NDK_VERSION: 28.0.13004108

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Android SDK packages + NDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build libbox.aar (gomobile bind, hiddify-sing-box)
        run: |
          set -e
          echo "Cloning hiddify-sing-box ${HSB_TAG}…"
          git clone --depth 1 --branch "${HSB_TAG}" https://github.com/hiddify/hiddify-sing-box.git hsb
          cd hsb
          HEAD="$(git rev-parse HEAD)"
          if [ "$HEAD" != "${HSB_SHA}" ]; then
            echo "::error::hiddify-sing-box ${HSB_TAG} = $HEAD, ожидался ${HSB_SHA} (тег перемещён?)"
            exit 1
          fi
          echo "Verified hiddify-sing-box commit $HEAD."

          # gomobile/gobind — форк sagernet (sing-box собирается только им).
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.11
          export PATH="$PATH:$(go env GOPATH)/bin"

          # build_libbox требует java "openjdk 17"; temurin 17 подходит.
          java --version

          # Собирает libbox.aar (API23) + libbox-legacy.aar (API21).
          go run ./cmd/internal/build_libbox -target android

          ls -lh libbox*.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          echo "libbox.aar -> app/libs/ ($(du -h libbox.aar | cut -f1))"

      - name: Build libXray.aar (gomobile bind, XTLS/libXray)
        run: |
          set -e
          echo "Cloning libXray ${LIBXRAY_TAG}…"
          git clone --depth 1 --branch "${LIBXRAY_TAG}" https://github.com/XTLS/libXray.git lx
          cd lx
          HEAD="$(git rev-parse HEAD)"
          if [ "$HEAD" != "${LIBXRAY_SHA}" ]; then
            echo "::error::libXray ${LIBXRAY_TAG} = $HEAD, ожидался ${LIBXRAY_SHA} (тег перемещён?)"
            exit 1
          fi
          echo "Verified libXray commit $HEAD."

          # gomobile/gobind — UPSTREAM golang.org/x/mobile (НЕ sagernet-форк: у xray
          # своя цепочка; перебивает binary libbox-шага, но тот уже отработал).
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          go mod download
          # gomobile bind требует x/mobile В ГРАФЕ модуля (новое поведение Go) —
          # добавляем в go.mod клона, иначе «missing golang.org/x/mobile dependency».
          go get golang.org/x/mobile/bind
          gomobile init

          # Флаги 1-в-1 из libXray build/app/android.py (checklinkname + 16KB page).
          gomobile bind -target android -androidapi 21 \
            -ldflags="-checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384" \
            -o libXray.aar .

          ls -lh libXray.aar
          cp libXray.aar "$GITHUB_WORKSPACE/app/libs/libXray.aar"
          echo "libXray.aar -> app/libs/ ($(du -h libXray.aar | cut -f1))"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ninety-release.jks"

      - name: Assemble release APKs (per-ABI)
        env:
          NINETY_KEYSTORE: ${{ runner.temp }}/ninety-release.jks
          NINETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NINETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APKs
        id: stage
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in main|"") VER="${GITHUB_SHA::7}";; esac
          DIR=app/build/outputs/apk/release
          mkdir -p staged
          for ABI in arm64-v8a armeabi-v7a; do
            cp "$DIR/app-${ABI}-release.apk" "staged/ninety-android-${VER}-${ABI}.apk"
            echo "staged ninety-android-${VER}-${ABI}.apk ($(du -h "$DIR/app-${ABI}-release.apk" | cut -f1))"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-apk
          path: staged/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ninety Android ${{ github.ref_name }}
          files: staged/*.apk
          prerelease: false
          make_latest: true
