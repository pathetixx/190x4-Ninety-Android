name: Build Ninety Android

# Релиз — только на push semver-тега vX.Y.Z. Для ad-hoc проверки — workflow_dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  # Ядро: hiddify-sing-box. Тег перемещаем → пин на конкретный SHA (supply-chain).
  HSB_TAG: v1.13.0.h5
  HSB_SHA: 9b6b004adfb079db2134b682f9b4ff42434c2f38
  # xray-core для xhttp — вшивается ВТОРЫМ пакетом (core/xraybridge.go) в ТОТ ЖЕ
  # gomobile-AAR (one Go runtime). Отдельный AAR нельзя: дубль go.* + два рантайма.
  # libXray как зависимость не берётся (CalVer-теги без /vN); xray-core (v1) — штатно.
  XRAY_VER: v1.260327.1-0.20260601021109-94ffd50060f1
  NDK_VERSION: 28.0.13004108

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Android SDK packages + NDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build libbox.aar (gomobile bind, hiddify-sing-box + xray)
        run: |
          set -e
          echo "Cloning hiddify-sing-box ${HSB_TAG}…"
          git clone --depth 1 --branch "${HSB_TAG}" https://github.com/hiddify/hiddify-sing-box.git hsb
          cd hsb
          HEAD="$(git rev-parse HEAD)"
          if [ "$HEAD" != "${HSB_SHA}" ]; then
            echo "::error::hiddify-sing-box ${HSB_TAG} = $HEAD, ожидался ${HSB_SHA} (тег перемещён?)"
            exit 1
          fi
          echo "Verified hiddify-sing-box commit $HEAD."

          # gomobile/gobind — форк sagernet (sing-box собирается только им).
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.11
          export PATH="$PATH:$(go env GOPATH)/bin"

          # --- two-core: вшиваем xray ВТОРЫМ пакетом (xraybridge) в тот же AAR ---
          # gomobile биндит несколько пакетов в один Go-рантайм → нет дубля go.*.
          echo "Adding xray-core ${XRAY_VER} + xraybridge…"
          mkdir -p xraybridge
          cp "$GITHUB_WORKSPACE/core/xraybridge.go" xraybridge/xraybridge.go
          go get github.com/xtls/xray-core@${XRAY_VER}
          go mod tidy
          # Дописываем ./xraybridge в bind-аргументы build_libbox (рядом с libbox),
          # переиспользуя его точные теги/ldflags/androidapi.
          sed -i 's#append(args, "./experimental/libbox")#append(args, "./experimental/libbox", "./xraybridge")#g' cmd/internal/build_libbox/main.go
          grep -n '"./xraybridge"' cmd/internal/build_libbox/main.go || { echo "::error::sed не пропатчил build_libbox"; exit 1; }

          # build_libbox требует java "openjdk 17"; temurin 17 подходит.
          java --version

          # Собирает libbox.aar (API23) + libbox-legacy.aar (API21) — теперь с xray внутри.
          go run ./cmd/internal/build_libbox -target android

          ls -lh libbox*.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          echo "libbox.aar (+xray) -> app/libs/ ($(du -h libbox.aar | cut -f1))"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ninety-release.jks"

      - name: Assemble release APKs (per-ABI)
        env:
          NINETY_KEYSTORE: ${{ runner.temp }}/ninety-release.jks
          NINETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NINETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APKs
        id: stage
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in main|"") VER="${GITHUB_SHA::7}";; esac
          DIR=app/build/outputs/apk/release
          mkdir -p staged
          for ABI in arm64-v8a armeabi-v7a; do
            cp "$DIR/app-${ABI}-release.apk" "staged/ninety-android-${VER}-${ABI}.apk"
            echo "staged ninety-android-${VER}-${ABI}.apk ($(du -h "$DIR/app-${ABI}-release.apk" | cut -f1))"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-apk
          path: staged/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ninety Android ${{ github.ref_name }}
          files: staged/*.apk
          prerelease: false
          make_latest: true
