name: Build Ninety Android

# Релиз — только на push semver-тега vX.Y.Z. Для ad-hoc проверки — workflow_dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  # Ядро: hiddify-sing-box. Тег перемещаем → пин на конкретный SHA (supply-chain).
  HSB_TAG: v1.13.0.h5
  HSB_SHA: 9b6b004adfb079db2134b682f9b4ff42434c2f38
  NDK_VERSION: 28.0.13004108
  # xray для xhttp-нод — отдельный standalone-бинарь (libxray.so в jniLibs), НЕ сливается
  # с libbox в один Go-бинарь (это ронял рантайм на всех нодах). Свой процесс, свои deps.
  XRAY_TAG: v26.3.27

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Android SDK packages + NDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build libbox.aar (gomobile bind, hiddify-sing-box)
        run: |
          set -e
          echo "Cloning hiddify-sing-box ${HSB_TAG}…"
          git clone --depth 1 --branch "${HSB_TAG}" https://github.com/hiddify/hiddify-sing-box.git hsb
          cd hsb
          HEAD="$(git rev-parse HEAD)"
          if [ "$HEAD" != "${HSB_SHA}" ]; then
            echo "::error::hiddify-sing-box ${HSB_TAG} = $HEAD, ожидался ${HSB_SHA} (тег перемещён?)"
            exit 1
          fi
          echo "Verified hiddify-sing-box commit $HEAD."

          # gomobile/gobind — форк sagernet (sing-box собирается только им).
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.11
          export PATH="$PATH:$(go env GOPATH)/bin"

          # build_libbox требует java "openjdk 17"; temurin 17 подходит.
          java --version

          # Собирает libbox.aar (API23) + libbox-legacy.aar (API21).
          go run ./cmd/internal/build_libbox -target android

          ls -lh libbox*.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          echo "libbox.aar -> app/libs/ ($(du -h libbox.aar | cut -f1))"

      - name: Build xray binaries (standalone → jniLibs)
        run: |
          set -e
          echo "Cloning xray-core ${XRAY_TAG}…"
          git clone --depth 1 --branch "${XRAY_TAG}" https://github.com/XTLS/Xray-core.git xray
          cd xray
          # HEAD xray-core требует Go > версии setup-go → авто-тулчейн подтянет нужный.
          export GOTOOLCHAIN=auto
          # -checklinkname=0: wlynxg/anet тянет //go:linkname на приватный net.zoneCache,
          # линкер новых Go это блокирует (как и sing-box → тот же флаг).
          LDF="-s -w -checklinkname=0"
          JL="$GITHUB_WORKSPACE/app/src/main/jniLibs"
          mkdir -p "$JL/arm64-v8a" "$JL/armeabi-v7a"
          echo "Building arm64-v8a…"
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="$LDF" -o "$JL/arm64-v8a/libxray.so" ./main
          echo "Building armeabi-v7a…"
          CGO_ENABLED=0 GOOS=android GOARCH=arm GOARM=7 go build -trimpath -ldflags="$LDF" -o "$JL/armeabi-v7a/libxray.so" ./main
          ls -lh "$JL"/*/libxray.so
          file "$JL/arm64-v8a/libxray.so" | grep -q "ARM aarch64" || { echo "::error::libxray.so не aarch64"; exit 1; }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ninety-release.jks"

      - name: Assemble release APKs (per-ABI)
        env:
          NINETY_KEYSTORE: ${{ runner.temp }}/ninety-release.jks
          NINETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NINETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APKs
        id: stage
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in main|"") VER="${GITHUB_SHA::7}";; esac
          DIR=app/build/outputs/apk/release
          mkdir -p staged
          for ABI in arm64-v8a armeabi-v7a; do
            cp "$DIR/app-${ABI}-release.apk" "staged/ninety-android-${VER}-${ABI}.apk"
            echo "staged ninety-android-${VER}-${ABI}.apk ($(du -h "$DIR/app-${ABI}-release.apk" | cut -f1))"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-apk
          path: staged/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ninety Android ${{ github.ref_name }}
          files: staged/*.apk
          prerelease: false
          make_latest: true
