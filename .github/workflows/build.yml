name: Build Ninety Android

# Core/data fail fast. Android build follows only after pure Kotlin and migration tests pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-split-jobs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HSB_TAG: v1.13.0.h5
  HSB_SHA: 9b6b004adfb079db2134b682f9b4ff42434c2f38
  NDK_VERSION: 28.0.13004108
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Model, parser, config, runtime and quality tests
        shell: bash
        run: |
          set -o pipefail
          gradle :core:model:test :core:parser:test :core:config:test :core:runtime:test :core:quality:test --no-daemon --stacktrace 2>&1 | tee ci-core-tests.log

      - name: Upload PR core diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-core-diagnostics-${{ github.event.pull_request.number }}
          if-no-files-found: warn
          path: |
            ci-core-tests.log
            core/model/build/reports/tests/**
            core/parser/build/reports/tests/**
            core/config/build/reports/tests/**
            core/runtime/build/reports/tests/**
            core/quality/build/reports/tests/**

  data:
    name: data migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Room mapping, normalization and graph delta tests
        shell: bash
        run: |
          set -o pipefail
          gradle :data:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ci-data-tests.log

      - name: Upload PR data diagnostics and schemas
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-data-diagnostics-${{ github.event.pull_request.number }}
          if-no-files-found: warn
          path: |
            ci-data-tests.log
            data/build/reports/tests/**
            data/schemas/**

  android:
    name: android verification
    needs: [core, data]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install Android SDK packages + NDK
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore pinned libbox.aar
        id: libbox_cache
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ runner.os }}-${{ env.HSB_SHA }}-${{ env.NDK_VERSION }}-gomobile-v0.1.11

      - name: Build libbox.aar (gomobile bind, hiddify-sing-box)
        if: steps.libbox_cache.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "Cloning hiddify-sing-box ${HSB_TAG}…"
          git clone --depth 1 --branch "${HSB_TAG}" https://github.com/hiddify/hiddify-sing-box.git hsb
          cd hsb
          HEAD="$(git rev-parse HEAD)"
          if [ "$HEAD" != "${HSB_SHA}" ]; then
            echo "::error::hiddify-sing-box ${HSB_TAG} = $HEAD, expected ${HSB_SHA}"
            exit 1
          fi
          echo "Verified hiddify-sing-box commit $HEAD."

          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.11
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android

          test -s libbox.aar
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Verify libbox.aar
        run: test -s app/libs/libbox.aar && ls -lh app/libs/libbox.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: App unit tests
        id: app_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ci-app-tests.log

      - name: Assemble debug APK
        id: assemble_debug
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ci-assemble-debug.log

      - name: Android debug lint
        id: lint_debug
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --no-daemon --stacktrace 2>&1 | tee ci-lint-debug.log

      - name: Verify optimized release and release lint
        id: release_verify
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:lintRelease --no-daemon --stacktrace 2>&1 | tee ci-release-verify.log

      - name: Enable KVM for managed device
        if: always() && steps.assemble_debug.outcome == 'success'
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: API 35 managed device tests
        id: instrumented
        if: always() && steps.assemble_debug.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:pixel2Api35DebugAndroidTest -Pninety.testEmulator=true --no-daemon --stacktrace 2>&1 | tee ci-instrumented.log

      - name: Upload PR Android diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-build-diagnostics-${{ github.event.pull_request.number }}
          if-no-files-found: warn
          path: |
            ci-app-tests.log
            ci-assemble-debug.log
            ci-lint-debug.log
            ci-release-verify.log
            ci-instrumented.log
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-debug/**
            app/build/reports/lint-results-release.*
            app/build/reports/lint-results-release/**
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**

      - name: Fail when Android verification failed
        if: always()
        env:
          APP_TESTS: ${{ steps.app_tests.outcome }}
          ASSEMBLE_DEBUG: ${{ steps.assemble_debug.outcome }}
          LINT_DEBUG: ${{ steps.lint_debug.outcome }}
          RELEASE_VERIFY: ${{ steps.release_verify.outcome }}
          INSTRUMENTED: ${{ steps.instrumented.outcome }}
        run: |
          echo "app tests:        $APP_TESTS"
          echo "assemble debug:   $ASSEMBLE_DEBUG"
          echo "lint debug:       $LINT_DEBUG"
          echo "release R8/lint:  $RELEASE_VERIFY"
          echo "instrumented:     $INSTRUMENTED"
          if [ "$APP_TESTS" != "success" ] || \
             [ "$ASSEMBLE_DEBUG" != "success" ] || \
             [ "$LINT_DEBUG" != "success" ] || \
             [ "$RELEASE_VERIFY" != "success" ] || \
             [ "$INSTRUMENTED" != "success" ]; then
            exit 1
          fi

      - name: Upload PR debug APKs
        if: github.event_name == 'pull_request' && steps.assemble_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-debug-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ninety-release.jks"

      - name: Assemble signed release APKs
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NINETY_KEYSTORE: ${{ runner.temp }}/ninety-release.jks
          NINETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NINETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace --rerun-tasks

      - name: Stage release APKs and checksums
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          case "$VER" in main|"") VER="${GITHUB_SHA::7}";; esac
          DIR=app/build/outputs/apk/release
          mkdir -p staged
          for ABI in arm64-v8a armeabi-v7a; do
            NAME="ninety-android-${VER}-${ABI}.apk"
            cp "$DIR/app-${ABI}-release.apk" "staged/$NAME"
            (cd staged && sha256sum "$NAME" > "$NAME.sha256")
            echo "staged $NAME ($(du -h "$DIR/app-${ABI}-release.apk" | cut -f1))"
          done

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ninety-android-apk
          path: staged/*

  publish:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v4
        with:
          name: ninety-android-apk
          path: staged

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Ninety Android ${{ github.ref_name }}
          files: staged/*
          prerelease: false
          make_latest: true
